name: Fechar Issues automaticamente

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Fechar Issues vinculadas ao Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const description = pr.body || ''

            const regex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi

            const issueNumbers = [
              ...new Set(
                [...description.matchAll(regex)].map(
                  match => Number(match[1])
                )
              )
            ]

            for (const issue_number of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                ...context.repo,
                issue_number
              })

              if (issue.pull_request || issue.state === 'closed') {
                continue
              }

              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: 'closed'
              })

              core.info(`Issue #${issue_number} fechada automaticamente.`)
            }